name: Build EchoRelay for macOS

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build unsigned universal app
        run: |
          set -euo pipefail
          rm -rf build dist
          xcodebuild \
            -project EchoRelay.xcodeproj \
            -scheme EchoRelay \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          mkdir -p dist
          APP="build/Build/Products/Release/EchoRelay.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/EchoRelay-macOS.zip"
          shasum -a 256 "dist/EchoRelay-macOS.zip" | tee "dist/SHA256.txt"

      - name: Upload EchoRelay app
        uses: actions/upload-artifact@v4
        with:
          name: EchoRelay-macOS
          path: |
            dist/EchoRelay-macOS.zip
            dist/SHA256.txt
          retention-days: 30
